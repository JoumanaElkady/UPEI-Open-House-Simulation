V:{n:'Smart Savers',lo:1700,hi:2700,mid:2200,aff:{s:.5,u:1,m:.5},sf:{o:.8,p:.85,h:1},base:24000,loss:.15}};
const PROD={core:{n:'PULSE CORE',c:900,f:{T:.35,V:1}},drop:{n:'PULSE STYLE',c:1500,f:{T:1,V:.3}},plus:{n:'PULSE PLUS',c:1100,f:{T:.65,V:.65}}};
const SALES={o:{n:'Online only',set:150e3,fix:150e3,per:120,reach:1},p:{n:'Pop-up stores',set:300e3,fix:250e3,per:200,reach:.6},h:{n:'Online + pop-ups',set:450e3,fix:400e3,per:260,reach:1.2}};
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const pFit=(p,s)=>p<s.lo?1-.9*(s.lo-p)/s.lo:p>s.hi?cl(1-2.5*(p-s.hi)/s.hi):1;
const dm=(p,s)=>p>s.hi?Math.max(.05,1-2.5*(p-s.hi)/s.hi):p<s.lo?1.2:1+.3*(s.mid-p)/s.mid;
const enOf=(s,mk)=>{let e=0;for(const k in mk)e+=mk[k]/8*s.aff[k];if(Math.max(...Object.values(mk))>=5)e*=.9;return cl(e/.8)};
function calc(d,gr){
 const T=SEG[d.seg],S=SALES[d.sales],P=PROD[d.prod];const p0=d.price;let price=p0;if(d.crisis=='A')price=Math.round(p0*.85);
 const dmx=s=>d.crisis=='A'?.25*dm(p0,s)+.75*dm(price,s):dm(p0,s);const pavg=d.crisis=='A'?.25*p0+.75*price:p0;
 const boost=d.crisis=='C'?.1:0;
 const un=(k,w)=>{const s=SEG[k],pf=cl(P.f[k]+boost);return s.base*.11*w*(.35+.65*pf)*dmx(s)*(.4+.6*enOf(s,d.mk))*S.reach*(.6+.4*s.sf[d.sales])};
 let U=0;for(const k in SEG)U+=un(k,k==d.seg?1:.12);
 const pf=cl(P.f[d.seg]+boost),pr=pFit(p0,T),en=enOf(T,d.mk),sf=T.sf[d.sales];
 const fitPre=.3*pf+.25*pr+.25*en+.2*sf;
 const loss=T.loss,res={A:.25,B:.45,C:.5,D:fitPre>=.75?.4:1}[d.crisis]*loss;U*=1-res;
 let spend=4e5+S.set+(d.crisis=='B'?2e5:0)+(d.crisis=='C'?2.5e5:0),gcost=0;
 const fin=(U,sp)=>{const rev=U*pavg,net=rev-U*P.c-U*S.per-S.fix-sp,gm=(pavg-P.c-S.per)/pavg;
  return{rev,net,gm,f:net<0?Math.max(0,20+net/5e4):100*(.6*cl(net/1.3e6)+.4*cl(gm/.5))}};
 let r=fin(U,spend);const healthy=(r.f/100*.6+fitPre*.4);let gs=0;
 if(gr){const g={range:healthy>.75?.9:healthy>.6?.6:.3,cities:healthy>.8&&d.sales!='p'?.9:healthy>.65?.55:.25,brand:healthy<.65?.9:healthy<.8?.75:.6}[gr];gs=g;
  gcost={range:3e5,cities:35e4,brand:2e5}[gr];U*=1+({range:.12,cities:.14,brand:.05}[gr])*g;r=fin(U,spend+gcost);}
 const cashPre=2e6+r.net;let comp=0,m=(price-P.c-S.per)/price;
 if(d.crisis=='A')comp=({V:.85,T:.35}[d.seg])-(m<.18?.25:0);
 if(d.crisis=='B')comp=({T:.85,V:.65}[d.seg])*(.6+.4*en);
 if(d.crisis=='C')comp=({T:.75,V:.55}[d.seg])-(pf>=1?.15:0);
 if(d.crisis=='D')comp=fitPre>=.75?.85:.25;
 if(cashPre<2.5e5)comp*=.7;comp=cl(comp);
 let brand=100*(.4*en+.3*pf+.3*pr)+({A:d.seg=='V'?2:-8,B:4,C:5,D:0}[d.crisis])+(gr=='brand'?5:0);brand=cl(brand,0,100);
 const fit=100*fitPre,cs=[pf,pr,en,sf,comp,gs||.5];
 const cons=100*(.5*cs.reduce((a,b)=>a+b)/cs.length+.5*Math.min(pf,pr,en,sf));
 const raw=.25*fit+.15*brand+.25*r.f+.15*comp*100+.2*cons;
 return{units:Math.round(U),rev:r.rev,net:r.net,cash:Math.max(0,2e6+r.net),share:U/20000*100,fit,brand,fin:r.f,comp:comp*100,cons,total:cl(100*Math.pow(raw/100,1.25),0,100),pf,pr,en,sf,gs,price,m};
}
const $=id=>document.getElementById(id),A=$('app');
const ST=n=>'★'.repeat(n)+'<i>'+'★'.repeat(5-n)+'</i>';
const E=n=>'EGP '+Math.round(n).toLocaleString('en-US');
const D={team:'',seg:null,prod:null,price:null,mk:{s:0,u:0,m:0},sales:null,crisis:null,growth:null};
let step=0,opened={},rep=false;
const SD={T:{t:'STYLE FANS',sz:40,age:'16–25',pr:[['Looking fashionable',5],['Owning something exclusive',4],['Comfort',3],['Low price',2]],px:'EGP 2,800–4,000',d:'They follow creators and trends on social media. They love sneakers that feel special and are happy to pay more.'},
V:{t:'SMART SAVERS',sz:60,age:'16–30',pr:[['Low price',5],['Comfort',5],['Lasts a long time',4],['Looking fashionable',3]],px:'EGP 1,700–2,700',d:'They compare options carefully. They want the best value for their money.'}};

<div class="more ${opened[k]||rep?'on':''}"><p class="muted">Age ${SD[k].age}. ${SD[k].d}</p><p class="sm">What matters to them:</p>${SD[k].pr.map(p=>`<div class="row sm"><span>${p[0]}</span><span class="st">${ST(p[1])}</span></div>`).join('')}<p class="px">Price they find OK<br><b>${SD[k].px}</b></p></div>
${opened[k]||rep?'':'<p class="tap">Tap to read ▾</p>'}</div>`;
const PD={core:{t:'A comfortable, affordable shoe for every day.',a:[['Comfort',5],['Fashion',3],['Exclusive',1]]},drop:{t:'Bold designs in limited editions. Customers can choose their own details.',a:[['Comfort',3],['Fashion',5],['Exclusive',5]]},plus:{t:'A bit of comfort and a bit of style. A shoe for everyone.',a:[['Comfort',4],['Fashion',4],['Exclusive',2]]}};
const hdr=r=>`<div class="top"><span>ROUND ${r} OF 7</span><div class="prog"><i style="width:${r/7*100}%"></i></div><span class="logo">UPEI</span></div>`;

function modal(){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="sheet"><button class="ghost" onclick="this.closest(\'.modal\').remove()">✕ Close</button>'+['T','V'].map(k=>{rep=true;const h=seg(k);rep=false;return h}).join('')+'</div>';document.body.appendChild(m)}
const go=n=>{step=n;scrollTo(0,0);render()};
const ok=(c,l,nx)=>`<button class="cta" ${c?'':'disabled'} onclick="${nx}">${l}</button>`;
const choose=(f,v)=>{D[f]=v;render()};
const opt=(f,v,b)=>`<div class="card opt ${D[f]===v?'sel':''}" onclick="choose('${f}','${v}')">${b}</div>`;
const left=()=>8-Object.values(D.mk).reduce((a,b)=>a+b);
const stars=a=>a.map(p=>`<div class="row sm"><span>${p[0]}</span><span class="st">${ST(p[1])}</span></div>`).join('');
function render(){if(step==11)return learn();if(step==20)return board();document.body.className=step==7?'crisis':'';let h='';
 if(step==0)h=`<div class="hero"><p class="eyebrow">UPEI CAIRO CAMPUS · BUSINESS CHALLENGE</p><h1>WELCOME TO<br><em>PULSE EGYPT</em></h1><p>Your team has <b>EGP 2,000,000</b> to start a new Egyptian sneaker company.</p><p class="muted">In the next 20 minutes you will decide:<br>Who will you sell to? What will you make? How much will you charge? Where will you spend your money? What will you do when a rival attacks?</p><p class="muted">Every choice changes your customers, costs and profit. At the end, the market decides if your company wins or fails.</p>
 <input id="tn" maxlength="18" placeholder="Team name" value="${D.team}" oninput="D.team=this.value.trim();$('go').disabled=!D.team"><button class="cta" id="go" ${D.team?'':'disabled'} onclick="go(1)">ENTER THE MARKET</button><button class="link" onclick="go(20)">Instructor leaderboard</button><p class="foot">Big Futures Start Here.</p></div>`;
 if(step==1)h=hdr(1)+`<h2>Read the market report</h2><p class="muted">Tap and read both customer groups before you continue.</p>${['T','V'].map(seg).join('')}${ok(['T','V'].every(k=>opened[k]),'CONTINUE','go(2)')}`;
 if(step==2)h=hdr(1)+`<h2>Which customers will PULSE focus on?</h2>${rbtn()}${['T','V'].map(k=>opt('seg',k,`<b class="h3">${SD[k].t}</b><p class="muted">${SD[k].sz}% of customers · Price they find OK: ${SD[k].px}</p>`)).join('')}<p class="note">You can still sell to the other group. But your results will be judged by how well you serve the group you pick.</p>${ok(D.seg,'LOCK IN','go(3)')}`;
 if(step==3)h=hdr(2)+`<h2>Choose your sneaker</h2>${rbtn()}${Object.keys(PD).map(k=>opt('prod',k,`<div class="row"><b class="h3">${PROD[k].n}</b><span class="pill">${E(PROD[k].c)} to make</span></div><p class="muted">${PD[k].t}</p>${stars(PD[k].a)}`)).join('')}${ok(D.prod,'LAUNCH THIS SNEAKER','go(4)')}`;
 if(step==4)h=hdr(3)+`<h2>Set your price</h2><div class="card fin"><div><small>Sneaker</small><b>${PROD[D.prod].n}</b></div><div><small>Cost to make</small><b>${E(PROD[D.prod].c)}</b></div><div><small>Customers</small><b>${SEG[D.seg].n}</b></div></div><p class="muted">Think about what customers will pay and how much you keep as profit.</p><div class="grid2">${[1899,2499,3199,3899].map(p=>opt('price',p,`<b class="big">${E(p)}</b>`)).join('')}</div>${rbtn()}${ok(D.price,'SET PRICE','go(5)')}`;
 if(step==5){const ch=[['s','SOCIAL MEDIA & CREATORS','Instagram, TikTok and Egyptian content creators.'],['u','UNIVERSITY EVENTS','Pop-ups, student ambassadors and free tryouts.'],['m','BIG ADS EVERYWHERE','Billboards and ads that reach lots of people.']];
 h=hdr(4)+`<h2>Split your marketing budget</h2><p class="muted">Use all of it. Each tap is EGP 50,000.</p><div class="card fin"><div><small>Total</small><b>EGP 400,000</b></div><div><small>Still to spend</small><b class="${left()?'warn':'good'}">${E(left()*5e4)}</b></div></div>${ch.map(c=>`<div class="card"><b class="h3">${c[1]}</b><p class="muted">${c[2]}</p><div class="row"><button class="pm" onclick="mk('${c[0]}',-1)">−</button><div class="bar grow"><span style="width:${D.mk[c[0]]*12.5}%"></span></div><button class="pm" onclick="mk('${c[0]}',1)">+</button></div><p class="amt">${E(D.mk[c[0]]*5e4)}</p></div>`).join('')}${ok(left()==0,'APPROVE BUDGET','go(6)')}`}
 if(step==6)h=hdr(5)+`<h2>How will people buy?</h2>${[['o','ONLINE ONLY',150,['Low running costs','Sells all over Egypt','Customers cannot try shoes on']],['p','POP-UP STORES',300,['Customers can try shoes on','Great brand experience','Only a few places, fewer customers']],['h','ONLINE + POP-UPS',450,['Reaches the most customers','Best customer experience','Highest running costs']]].map(s=>opt('sales',s[0],`<div class="row"><b class="h3">${s[1]}</b><span class="pill">Setup ${E(s[2]*1e3)}</span></div><ul>${s[3].map(x=>`<li>${x}</li>`).join('')}</ul>`)).join('')}${ok(D.sales,'CHOOSE','go(7)')}`;
 if(step==7)h=hdr(6)+`<div class="alert">⚠️ MARKET UPDATE</div><h2>3 months later…</h2><p>A big international brand launches a stylish sneaker in Egypt for <b>EGP 2,699</b>. If you do nothing, PULSE could lose <b>10–20%</b> of its customers. But reacting costs money.</p>${[['A','CUT YOUR PRICE BY 15%','May keep customers. You earn less on each pair.'],['B','SPEND EGP 200,000 MORE ON MARKETING','Keeps people thinking about PULSE. Less cash left.'],['C','SPEND EGP 250,000 TO IMPROVE THE SNEAKER','Makes your product better. Costs a lot and does not lower your price.'],['D','DO NOTHING','Keep your cash and trust your plan. Risky if customers do not really love your product.']].map(c=>opt('crisis',c[0],`<b class="h3">${c[0]} — ${c[1]}</b><p class="muted">${c[2]}</p>`)).join('')}${ok(D.crisis,'RESPOND','go(8)')}`;
 if(step==8)h=hdr(7)+`<h2>Last decision: how will you grow?</h2><p>PULSE survived its launch. Where will you invest next?</p>${[['range','ADD NEW SNEAKERS',300,'Could bring in more customers. More stock to manage.'],['cities','SELL IN MORE CITIES',350,'Could reach more people. Needs delivery and marketing.'],['brand','MAKE YOUR BRAND STRONGER',200,'Better service and a better sneaker for customers you already have. Slower growth, less risk.']].map(g=>opt('growth',g[0],`<div class="row"><b class="h3">${g[1]}</b><span class="pill">${E(g[2]*1e3)}</span></div><p class="muted">${g[3]}</p>`)).join('')}${ok(D.growth,'FINISH & SEE RESULTS','sim()')}`;
 A.innerHTML=h;if(step==1)document.querySelectorAll('.seg').forEach(e=>e.onclick=()=>{opened[e.dataset.k]=1;render()});if(step==0)A.querySelector('.hero').classList.add('in')}
function mk(k,d){const v=D.mk[k]+d;if(v<0||v>8||(d>0&&!left()))return;D.mk[k]=v;render()}
document.addEventListener('click',e=>{const s=e.target.closest('.modal .seg');if(s)s.querySelector('.more').classList.add('on')});
function sim(){step=9;document.body.className='';const m=['Counting customers...','Checking your rival...','Adding up sales...','Adding up costs...','Measuring your brand...'];let i=0;A.innerHTML='<div class="hero in center"><div class="spin"></div><h2>SIMULATING THE MARKET...</h2><p class="muted" id="sm">'+m[0]+'</p></div>';
 const t=setInterval(()=>{i++;if(i<m.length)$('sm').textContent=m[i];else{clearInterval(t);A.innerHTML='<div class="hero in center"><h1><em>THE MARKET<br>HAS SPOKEN.</em></h1></div>';setTimeout(results,1800)}},800)}
const chk=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%46656;return h.toString(36).toUpperCase().padStart(3,'0')};
const CLS=[[95,'🏆','MARKET DOMINATOR','Amazing strategy and amazing profit.'],[85,'🥇','MARKET LEADER','A strong strategy, very well done.'],[75,'🚀','GROWTH COMPANY','Great potential, with a few weak spots.'],[65,'📈','SURVIVING STARTUP','You survived, but some choices held you back.'],[50,'⚠️','STRATEGIC TROUBLE','Your choices did not fit together well.'],[0,'💥','BUSINESS FAILURE','Time for a complete restart.']];
function results(){step=10;const r=calc(D,D.growth),c=CLS.find(x=>r.total>=x[0]),S=SEG[D.seg],P=PROD[D.prod];
 const good=[],bad=[],tp=Math.round(r.total*10),nm=D.team.replace(/-/g,' '),code=nm+'-'+tp+'-'+chk(nm+tp);
 r.pf>=.9?good.push(`${P.n} is what ${S.n} want.`):r.pf<.6&&bad.push(`${P.n} was not a good match for ${S.n}.`);
 r.pr>=.95?good.push(`${E(D.price)} is a price ${S.n} are happy to pay.`):D.price>S.hi?bad.push(`${E(D.price)} was too high for ${S.n} (they pay ${E(S.lo)}–${E(S.hi)}), so fewer people bought.`):bad.push(`${E(D.price)} was lower than ${S.n} expected, so you earned less on each pair.`);
 r.m<.3?bad.push(`You kept only ${Math.round(r.m*100)}% of each sale after costs, so profit stayed small.`):r.m>.5&&good.push(`You kept ${Math.round(r.m*100)}% of each sale, so sales became real profit.`);

function rank(){const rows=[],bad=[];$('ta').value.split('\n').map(s=>s.trim()).filter(Boolean).forEach(l=>{const m=l.match(/^(.*)-(\d{1,4})-([0-9A-Za-z]{3})$/);m&&chk(m[1]+m[2])==m[3].toUpperCase()?rows.push([m[1],+m[2]/10]):bad.push(l)});rows.sort((a,b)=>b[1]-a[1]);
 $('lb').innerHTML=(rows[0]?`<div class="card win">🏆 WINNER<b class="h3">${rows[0][0]}</b><span>${rows[0][1].toFixed(1)}</span></div>`:'')+rows.map((r,i)=>`<div class="card row"><span>${i+1}. ${r[0]}</span><b>${r[1].toFixed(1)}</b></div>`).join('')+bad.map(l=>`<p class="warn">Invalid code: ${l}</p>`).join('')}
